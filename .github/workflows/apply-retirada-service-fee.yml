name: Apply retirada service fee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-retirada-service-fee.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixed R$3 service fee to retirada
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          # 1) Configuração central: R$ 3 fixos para retirada.
          marker = "  entrega: {\n"
          retirada_block = "  retirada: {\n    // Taxa de serviço fixa para pedidos retirados no local.\n    taxaServico: 3.00,\n  },\n\n"
          assert s.count(marker) == 1, f'entrega marker count={s.count(marker)}'
          s = s.replace(marker, retirada_block + marker, 1)

          # 2) Total usado também no cálculo de troco.
          pattern = r"function totalPedidoCentavos\(\)\{.*?\n\}\nfunction valorTrocoCentavos"
          replacement = """function totalPedidoCentavos(){
            const subtotalCentavos = Math.round(cartTotals().subtotal * 100);
            if(deliveryMethod === 'retirada'){
              return subtotalCentavos + Math.round(CONFIG.retirada.taxaServico * 100);
            }
            if(deliveryMethod !== 'entrega' || frete.status !== 'ok') return subtotalCentavos;
            return subtotalCentavos + Math.round(frete.valor * 100) + Math.round(taxaServicoPorDistancia(frete.distanciaKm) * 100);
          }
          function valorTrocoCentavos"""
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, f'totalPedidoCentavos replacements={n}'

          # 3) Checkout e WhatsApp devem usar a taxa fixa na retirada.
          old = "  const taxaServico = (deliveryMethod === 'entrega' && frete.status === 'ok') ? taxaServicoPorDistancia(frete.distanciaKm) : 0;"
          new = """  const taxaServico = deliveryMethod === 'retirada'
            ? CONFIG.retirada.taxaServico
            : ((deliveryMethod === 'entrega' && frete.status === 'ok') ? taxaServicoPorDistancia(frete.distanciaKm) : 0);"""
          assert s.count(old) == 2, f'taxaServico client count={s.count(old)}'
          s = s.replace(old, new)

          # 4) Mostra a taxa de serviço no resumo da retirada.
          checkout_start = s.index('function renderCheckout(){')
          checkout_end = s.index('\nfunction abrirCheckout(){', checkout_start)
          checkout = s[checkout_start:checkout_end]
          needle = "  }\n\n  document.getElementById('summaryBox').innerHTML = `"
          assert checkout.count(needle) == 1, f'summary needle count={checkout.count(needle)}'
          checkout = checkout.replace(
            needle,
            """  } else if(deliveryMethod === 'retirada'){
              entregaLinha = `<div class=\"summary-row\"><span>Taxa de serviço</span><span>${fmtPreco(taxaServico)}</span></div>`;
            }

            document.getElementById('summaryBox').innerHTML = `""",
            1,
          )
          s = s[:checkout_start] + checkout + s[checkout_end:]

          # 5) WhatsApp: detalha produtos + taxa + total na retirada.
          msg_start = s.index('function montarMensagemPedido(')
          msg_end = s.index('\n\nfunction criarIdPedido()', msg_start)
          msg = s[msg_start:msg_end]
          pattern = r"  const blocoValores = deliveryMethod === 'entrega'.*?;\n\n  return \["
          replacement = """  const blocoValores = deliveryMethod === 'entrega'
            ? `💰 TOTAL\\
          Produtos: ${fmtPreco(subtotal)}\\
          Entrega: ${fmtPreco(taxaEntrega)}\\
          Taxa de serviço: ${fmtPreco(taxaServico)}\\
          TOTAL: ${fmtPreco(total)}`
            : `💰 TOTAL\\
          Produtos: ${fmtPreco(subtotal)}\\
          Taxa de serviço: ${fmtPreco(taxaServico)}\\
          TOTAL: ${fmtPreco(total)}`;

            return ["""
          msg, n = re.subn(pattern, lambda _: replacement, msg, count=1, flags=re.S)
          assert n == 1, f'blocoValores replacements={n}'
          s = s[:msg_start] + msg + s[msg_end:]

          # 6) Envia a taxa da retirada junto do payload da comanda.
          payload_start = s.index('function montarPayloadPedido(')
          payload_end = s.index('\n\nasync function registrarPedidoParaImpressao', payload_start)
          payload = s[payload_start:payload_end]
          needle = "\n  return {\n    clientRequestId,"
          assert payload.count(needle) == 1, f'payload return count={payload.count(needle)}'
          payload = payload.replace(
            needle,
            """
            if(deliveryMethod === 'retirada'){
              atendimento = {
                tipo: 'retirada',
                taxaServicoCentavos: Math.round(CONFIG.retirada.taxaServico * 100),
              };
            }

            return {
              clientRequestId,""",
            1,
          )
          s = s[:payload_start] + payload + s[payload_end:]

          index.write_text(s, encoding='utf-8')

          # 7) Servidor é a fonte de verdade para a comanda: retirada = R$ 3.
          api = Path('api/pedidos.js')
          p = api.read_text(encoding='utf-8')
          old = """  const atendimento = { tipo };
          if(tipo === 'mesa'){"""
          new = """  const atendimento = { tipo };
          if(tipo === 'retirada'){
            // Taxa fixa de serviço para retirada no local.
            atendimento.taxaServicoCentavos = 300;
          }
          if(tipo === 'mesa'){"""
          assert p.count(old) == 1, f'backend atendimento block count={p.count(old)}'
          p = p.replace(old, new, 1)
          api.write_text(p, encoding='utf-8')

          # Guardas finais antes de qualquer commit.
          assert s.count('CONFIG.retirada.taxaServico') >= 4
          assert 'Taxa de serviço</span><span>${fmtPreco(taxaServico)}' in s
          assert 'taxaServicoCentavos: Math.round(CONFIG.retirada.taxaServico * 100)' in s
          assert 'atendimento.taxaServicoCentavos = 300' in p

      - name: Validate syntax and snapshot
        run: |
          node --check api/pedidos.js
          node scripts/validate-snapshot.js

      - name: Commit applied change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-retirada-service-fee.yml
          git add index.html api/pedidos.js
          git commit -m "Cobra taxa fixa de R$ 3 na retirada"
          git push origin HEAD:main
