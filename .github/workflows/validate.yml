name: Validate production snapshot

on:
  push:
    branches: [main, security-hardening-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate snapshot
        run: npm run validate
      - name: Test automatic order receipt
        run: node tests/comanda-confirmacao.test.js
      - name: Test monthly order history
        run: node tests/historico-mensal.test.js
      - name: Test large print queue
        run: node tests/fila-impressao.test.js
      - name: Test ghost-free checkout
        run: node tests/checkout-sem-fantasma.test.js
      - name: Check thermal receipt layout
        run: node tests/print-layout.test.js
      - name: Test payments, catalog and real queue SQL
        run: npm test
      - name: Install Chromium for checkout tests
        run: npx playwright install --with-deps chromium
      - name: Test checkout in Chromium
        run: npm run test:browser
      - name: Check API syntax
        run: |
          for file in api/*.js lib/*.js scripts/*.js; do node --check "$file" || exit; done
