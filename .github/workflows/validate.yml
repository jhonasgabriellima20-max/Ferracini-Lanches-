name: Validate production snapshot

on:
  push:
    branches: [main, security-hardening-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate snapshot
        run: npm run validate
      - name: Test all order, delivery, catalog, payment and queue regressions
        run: npm test
      - name: Install Chromium for checkout tests
        run: npx playwright install --with-deps chromium
      - name: Test checkout in Chromium
        run: npm run test:browser
      - name: Check API syntax
        run: |
          for file in api/*.js lib/*.js scripts/*.js; do node --check "$file" || exit; done
