name: Validate production snapshot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate snapshot
        run: node scripts/validate-snapshot.js
      - name: Check API syntax
        run: |
          node --check api/comanda.js
          node --check api/distancia.js
          node --check api/disponibilidade.js
          node --check api/pedidos.js
