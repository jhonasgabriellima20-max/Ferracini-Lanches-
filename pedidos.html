<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>Ferracini — Pedidos</title>
<style>
:root{--bg:#14100c;--surface:#1e1812;--surface2:#282019;--line:#3a2e23;--text:#f7f0e8;--dim:#b9aa9b;--orange:#f04b23;--green:#2dbb68;--red:#df4e4e;--yellow:#d9a727;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(100% - 24px,900px);margin:0 auto;padding:22px 0 70px}.brand{font-weight:950;letter-spacing:.08em}.brand span{color:var(--orange)}h1{font-size:clamp(28px,7vw,44px);line-height:1;margin:8px 0}.sub{color:var(--dim);font-size:14px;line-height:1.5}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.login{max-width:450px;margin:70px auto}.field{display:grid;gap:7px}.field label{font-size:13px;color:var(--dim);font-weight:750}.field input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:16px;outline:none}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;font-size:14px;cursor:pointer}.btn-primary{background:var(--orange);color:#fff;width:100%;margin-top:12px}.btn-ghost{background:var(--surface2);border:1px solid var(--line);color:var(--text)}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.toolbar{position:sticky;top:0;z-index:10;background:rgba(20,16,12,.94);backdrop-filter:blur(10px);padding:10px 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:12px;color:var(--dim)}.count{font-size:12px;font-weight:900;background:var(--orange);padding:5px 9px;border-radius:999px}.orders{display:grid;gap:12px}.order{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:16px;padding:16px}.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.num{font-size:24px;font-weight:950}.time{font-size:12px;color:var(--dim)}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850;background:#ffffff0b;border:1px solid var(--line);margin-top:6px}.customer{margin-top:13px;font-weight:850}.phone{font-size:13px;color:var(--dim);margin-top:2px}.items{margin:13px 0;padding:12px;background:var(--surface2);border-radius:12px}.item{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}.item:last-child{border-bottom:0}.addon,.obs{color:var(--dim);font-size:12px;margin-top:2px}.details{display:grid;gap:6px;font-size:13px;line-height:1.5}.total{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:18px;font-weight:950}.actions{display:flex;gap:8px;margin-top:12px}.wa{display:block;text-align:center;text-decoration:none;background:#1f9d55;color:white;border-radius:11px;padding:11px 12px;font-weight:850;font-size:13px;flex:1}.empty{text-align:center;padding:34px 18px;color:var(--dim)}.notice{padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.5;margin:12px 0}.notice.err{background:#3c1919;border:1px solid #6b2929;color:#ffc7c7}.notice.ok{background:#143420;border:1px solid #245d38;color:#bff1cf}.new{animation:pulse 1.2s ease 2}@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(240,75,35,.22)}}
</style>
</head>
<body>
<div class="wrap">
  <section id="loginView" class="login card">
    <div class="brand">FERRACINI<span>.</span></div>
    <h1>Pedidos</h1>
    <p class="sub">Use a mesma senha do painel administrativo.</p>
    <div class="field" style="margin-top:18px"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" placeholder="Digite a senha"></div>
    <button class="btn btn-primary" id="entrar">Entrar</button>
    <div id="loginMsg"></div>
  </section>

  <main id="appView" class="hidden">
    <div class="top"><div><div class="brand">FERRACINI<span>.</span></div><h1>Pedidos de hoje</h1><p class="sub">Atualiza automaticamente. O WhatsApp continua funcionando normalmente.</p></div><button class="btn btn-ghost" id="sair">Sair</button></div>
    <div class="toolbar"><div class="status" id="status">Carregando…</div><div class="count" id="count">0 pedidos</div></div>
    <div id="systemMsg"></div>
    <div id="orders" class="orders"></div>
  </main>
</div>
<script>
let senhaAdmin = sessionStorage.getItem('ferracini_admin_password') || '';
let idsConhecidos = new Set();
let primeiraCarga = true;
let timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dinheiro = centavos => (Number(centavos || 0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hora = iso => { try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch{return '';} };
const notice = (text,type='ok') => `<div class="notice ${type}">${esc(text)}</div>`;

function tocarAviso(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(.001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+.36);
  }catch{}
}

function telefoneWa(tel){
  const d = String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  return d.startsWith('55') ? d : `55${d}`;
}

function tipoAtendimento(p){
  if(p.atendimento?.tipo === 'entrega') return '🚚 Entrega';
  if(p.atendimento?.tipo === 'mesa') return `🍽️ Mesa ${esc(p.atendimento?.mesa || '')}`;
  return '🏪 Retirada';
}

function pagamento(p){
  if(p.pagamento?.metodo === 'dinheiro'){
    if(p.pagamento?.precisaTroco) return `Dinheiro · troco para ${dinheiro(p.pagamento.trocoParaCentavos)}`;
    return 'Dinheiro';
  }
  if(p.pagamento?.metodo === 'pix') return 'Pix · conferir comprovante no WhatsApp';
  return 'Forma de pagamento não informada';
}

function endereco(p){
  const e=p.atendimento?.endereco;
  if(!e) return '';
  return [e.rua, e.numero, e.complemento, e.bairro, e.cidade, e.cep].filter(Boolean).map(esc).join(' · ');
}

function render(pedidos){
  $('count').textContent = `${pedidos.length} ${pedidos.length===1?'pedido':'pedidos'}`;
  if(!pedidos.length){ $('orders').innerHTML='<div class="card empty">Nenhum pedido registrado hoje.</div>'; return; }
  $('orders').innerHTML = pedidos.map(p=>{
    const novo = !idsConhecidos.has(p.id) && !primeiraCarga;
    const itens=(p.itens||[]).map(i=>{
      const ads=(i.adicionais||[]).map(a=>a.nome).filter(Boolean);
      return `<div class="item"><strong>${esc(i.quantidade)}x ${esc(i.nome)}</strong>${ads.length?`<div class="addon">+ ${ads.map(esc).join(', ')}</div>`:''}${i.observacao?`<div class="obs">Obs: ${esc(i.observacao)}</div>`:''}</div>`;
    }).join('');
    const wa=telefoneWa(p.cliente?.telefone);
    const end=endereco(p);
    const previsao=p.atendimento?.estimativaMinutos;
    return `<article class="order ${novo?'new':''}">
      <div class="order-head"><div><div class="num">Comanda ${esc(p.numero||'—')}</div><div class="tag">${tipoAtendimento(p)}</div></div><div class="time">${hora(p.criadoEm)}</div></div>
      <div class="customer">${esc(p.cliente?.nome||'Cliente')}</div><div class="phone">${esc(p.cliente?.telefone||'')}</div>
      <div class="items">${itens}</div>
      <div class="details">${end?`<div>📍 ${end}</div>`:''}${p.atendimento?.taxaEntregaCentavos?`<div>🚚 Taxa: ${dinheiro(p.atendimento.taxaEntregaCentavos)}</div>`:''}${previsao?`<div>⏱️ Previsão: ${esc(previsao.minimo)} a ${esc(previsao.maximo)} min</div>`:''}<div>💳 ${esc(pagamento(p))}</div></div>
      <div class="total"><span>Total</span><span>${dinheiro(p.totalCentavos)}</span></div>
      ${wa?`<div class="actions"><a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">Abrir WhatsApp do cliente</a></div>`:''}
    </article>`;
  }).join('');

  const novos = pedidos.filter(p=>!idsConhecidos.has(p.id));
  if(!primeiraCarga && novos.length) tocarAviso();
  idsConhecidos = new Set(pedidos.map(p=>p.id));
  primeiraCarga=false;
}

async function carregar(){
  try{
    const r=await fetch('/api/painel-pedidos?t='+Date.now(),{cache:'no-store',headers:{'X-Admin-Password':senhaAdmin}});
    const data=await r.json().catch(()=>({}));
    if(r.status===401){ sessionStorage.removeItem('ferracini_admin_password'); senhaAdmin=''; throw new Error('Senha administrativa incorreta.'); }
    if(!r.ok) throw new Error(data.error||'Não foi possível carregar os pedidos.');
    $('systemMsg').innerHTML='';
    render(data.pedidos||[]);
    $('status').textContent=`Atualizado às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  }catch(e){
    $('systemMsg').innerHTML=notice(e.message||'Falha ao atualizar pedidos.','err');
    $('status').textContent='Sem atualização';
  }
}

async function abrirPainel(){
  $('loginMsg').innerHTML='';
  try{
    const r=await fetch('/api/painel-pedidos?t='+Date.now(),{cache:'no-store',headers:{'X-Admin-Password':senhaAdmin}});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||'Não foi possível entrar.');
    $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
    render(data.pedidos||[]);
    $('status').textContent='Painel conectado';
    clearInterval(timer); timer=setInterval(carregar,30000);
  }catch(e){ $('loginMsg').innerHTML=notice(e.message||'Não foi possível entrar.','err'); }
}

$('entrar').addEventListener('click',()=>{ const s=$('senha').value.trim(); if(!s){$('loginMsg').innerHTML=notice('Digite a senha.','err');return;} senhaAdmin=s; sessionStorage.setItem('ferracini_admin_password',s); abrirPainel(); });
$('senha').addEventListener('keydown',e=>{if(e.key==='Enter')$('entrar').click();});
$('sair').addEventListener('click',()=>{ clearInterval(timer); sessionStorage.removeItem('ferracini_admin_password'); location.reload(); });
if(senhaAdmin) abrirPainel();
</script>
</body>
</html>
